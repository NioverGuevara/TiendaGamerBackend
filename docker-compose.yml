# Levanta MySQL + backend con un solo comando:   docker compose up --build
services:
  mysql:
    image: mysql:8.0
    container_name: tienda-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-tienda1234}
      MYSQL_DATABASE: tienda_gamer
    volumes:
      - tienda-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-tienda1234}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: tienda-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/tienda_gamer?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-tienda1234}
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-para-docker-compose-minimo-32-caracteres-2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}

volumes:
  tienda-mysql:
