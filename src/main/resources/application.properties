spring.application.name=tienda-gamer-backend
server.port=8080

# ---- Base de datos MySQL (se pueden cambiar con variables de entorno) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_gamer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:tienda-gamer-clave-secreta-de-desarrollo-cambiar-en-produccion-2026}
app.jwt.access-minutes=30
app.jwt.refresh-days=7

# ---- CORS (origen del frontend React/Vite) ----
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# ---- Datos iniciales ----
app.seed.enabled=true

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
